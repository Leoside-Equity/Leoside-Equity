<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Offline · Leoside Equity</title>
<meta name="description" content="You are offline.">
<link rel="icon" href="assets/img/logo.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/logo.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E141C">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<script>(function(){try{var t=localStorage.getItem('leoside.theme');if(!t&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches)t='dark';if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
</head>
<body>
<main id="main">
  <div class="wrap wrap--tight" style="padding:5rem 0;text-align:center">
    <img src="assets/img/logo.png" alt="" width="56" height="56" style="margin:0 auto 1.6rem">
    <h1 style="margin-bottom:.8rem">You are offline</h1>
    <p class="lede" style="max-width:46ch;margin:0 auto 2rem">
      Reports are fetched fresh every time, so they need a connection. The moment
      you are back online this page will work again.
    </p>
    <button class="btn btn--lg" type="button" onclick="location.reload()">Try again</button>
  </div>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>No connection · Leoside Equity</title>
<meta name="description" content="You are offline. Leoside Equity needs a connection to load reports.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#F6F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#08090B" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/assets/img/icon-192.png" type="image/png" sizes="192x192">
<link rel="stylesheet" href="/assets/css/styles.css">
<script src="/assets/js/boot.js"></script>
</head>
<body>
<!-- Served by the service worker when the network is gone, so it depends on
     nothing but the stylesheet and two tiny scripts, all cached with it. -->
<main id="main" class="wrap nf" style="min-height:100vh;display:grid;align-content:center">
  <img src="/assets/img/logo-128.webp" alt="" width="64" height="64" style="margin-bottom:32px">
  <p class="nf__code">Offline</p>
  <h1>You are not connected</h1>
  <p class="lede">Reports are loaded fresh each time, so they need a connection. Nothing is lost: your account, saved list and reading history are held on the server and will be exactly where you left them.</p>
  <div class="row" style="margin-top:24px">
    <button class="btn btn--lg" type="button" id="retry">Try again</button>
    <a class="btn btn--ghost btn--lg" href="/">Home page</a>
  </div>
  <p class="label" style="margin-top:32px" id="status" role="status">Waiting for a connection</p>
</main>
<script defer src="/assets/js/offline.js"></script>
</body>
</html>
